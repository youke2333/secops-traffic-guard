<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 智能流量安全检测与分析系统</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* 登录页独立于大屏 rem 适配体系（屏宽/22 会让输入框/间距失控），固定像素基准 */
        html { font-size: 16px; }
    </style>
</head>

<body class="login-body">
    <main class="login-card">
        <div class="login-brand"><span class="logo">◈</span> 智能流量安全检测与分析系统</div>
        <p class="login-sub">请使用运维账号登录。首次登录必须修改初始密码。</p>

        <form id="loginForm" autocomplete="off">
            <div class="login-field">
                <label class="login-label" for="username">用户名</label>
                <input class="input login-input" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label class="login-label" for="password">密码</label>
                <input class="input login-input" id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary login-submit" id="btnLogin" type="submit">登录</button>
            <p class="login-error" id="loginError" role="alert"></p>
        </form>

        <form id="passwordForm" class="hidden">
            <p class="login-warn">首次登录需要修改密码（至少 10 位，含字母与数字，不能与用户名相同）。</p>
            <div class="login-field">
                <label class="login-label" for="currentPassword">当前密码</label>
                <input class="input login-input" id="currentPassword" type="password" autocomplete="current-password" required>
            </div>
            <div class="login-field">
                <label class="login-label" for="newPassword">新密码</label>
                <input class="input login-input" id="newPassword" type="password" autocomplete="new-password" required>
            </div>
            <div class="login-field">
                <label class="login-label" for="confirmPassword">确认新密码</label>
                <input class="input login-input" id="confirmPassword" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary login-submit" id="btnChangePassword" type="submit">修改密码并进入系统</button>
            <p class="login-error" id="passwordError" role="alert"></p>
        </form>

        <p class="login-foot">本系统仅用于授权的安全检测与演练。所有登录与处置动作都会写入审计日志。</p>
    </main>
    <script src="js/page-login.js"></script>
</body>

</html>
