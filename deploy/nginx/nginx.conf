# ============================================================================
# nginx 站点配置：托管大屏静态资源 + 反向代理后端 API
# 关键点：SSE（/api/v1/stream/*）必须关闭代理缓冲，否则实时推送会被攒批延迟
# ============================================================================
upstream secops_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index dashboard/index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 大屏入口 ----------
    location = / {
        return 302 /dashboard/;
    }

    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
        # 大屏资源更新后立即生效，避免浏览器缓存旧版 JS
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 实时推送（SSE） ----------
    location /api/v1/stream/ {
        proxy_pass http://secops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;             # 关闭缓冲 → 毫秒级推送
        proxy_cache off;
        proxy_read_timeout 24h;          # 长连接保持
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ---------- 普通 API ----------
    location /api/ {
        proxy_pass http://secops_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;         # 漏洞扫描可能耗时较长
        proxy_buffering off;
    }

    location /docs {
        proxy_pass http://secops_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://secops_api;
        proxy_set_header Host $host;
    }

    # 安全响应头（大屏为纯静态演示界面，未使用第三方 CDN）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
