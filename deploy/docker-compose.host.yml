# ============================================================================
# 覆盖文件：让后端容器使用宿主机网络 + 内核能力
#
# 仅在需要「抓到宿主机全部网卡流量」或「真正下发 iptables/nft 规则」时使用：
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#
# 代价与注意事项：
#   * network_mode: host 后端口映射失效，后端直接监听宿主机 8000；
#   * 此时 nginx 容器若仍在 bridge 网络，请把 API 地址改成 http://host.docker.internal:8000
#     或直接把 nginx 也改成 host 网络（见文件末尾注释）；
#   * 建议把 DRY_RUN 先保持 true，观察大屏告警质量，再切换到 false。
# ============================================================================
services:
  api:
    network_mode: host
    # host 网络下无法再使用服务名访问 db/tsdb，因此这里也切到宿主机可达地址
    environment:
      DB_URL: postgresql+psycopg2://secops:${POSTGRES_PASSWORD:-secops_change_me}@127.0.0.1:5432/secops
      INFLUX_URL: http://127.0.0.1:8086
      CAPTURE_MODE: ${CAPTURE_MODE:-auto}
      FIREWALL_BACKEND: ${FIREWALL_BACKEND:-iptables}
    # 复用宿主机网络后，原始 iptables 规则会与宿主机共享，务必确认白名单已包含办公网出口
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN        # eBPF/BCC 挂载 tracefs 需要
    pid: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw   # BCC 需要
      - /usr/src:/usr/src:ro                     # 内核头文件（编译 eBPF 程序）
      - /lib/modules:/lib/modules:ro
      - api-data:/app/data
    ports: []

  # 需要 nginx 也使用 host 网络时，取消下面注释并把 nginx.conf 的 upstream 改为 127.0.0.1:8000
  # dashboard:
  #   network_mode: host
  #   ports: []
